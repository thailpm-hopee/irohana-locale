name: CI

# Run build + test on every pull request (and on pushes to main so the
# default branch always has a green baseline).
on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Keep compatibility coverage broad across active and recent LTS/current.
        node-version: [18.x, 20.x, 22.x, 24.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # `npm ci` also runs the "prepare" script (husky). HUSKY=0 skips hook
      # installation in CI, where git hooks are irrelevant.
      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Build (syntax check)
        run: npm run build

      - name: Test
        # Run only the project test suite; avoid auto-discovering local .claude hook tests.
        run: node --test test/*.test.mjs
